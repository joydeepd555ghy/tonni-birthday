<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday, Maharani — Tonni Sarker</title>
  <meta name="description" content="A royal birthday premiere and love letter for Maharani Tonni Sarker.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#12030c">

  <!-- Open Graph / Social Preview -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Galada&family=Great+Vibes&family=Hind+Siliguri:wght@300;400;500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/base.css?v=14">
  <link rel="stylesheet" href="css/sections.css?v=14">
  <link rel="stylesheet" href="css/effects.css?v=14">
</head>
<body>
  <!-- Scroll Progress Golden Thread -->
  <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>

  <!-- Dreamy Romantic Aurora + Floating Photo Glimpses Backdrop -->
  <div id="dream-backdrop" class="dream-backdrop" aria-hidden="true">
    <div class="dream-aurora"></div>
    <div id="dream-glimpses" class="dream-glimpses"></div>
  </div>

  <!-- Ambient Background Canvases -->
  <canvas id="ambient-canvas" class="bg-canvas" aria-hidden="true"></canvas>
  <canvas id="fireworks-canvas" class="fw-canvas" aria-hidden="true"></canvas>

  <!-- Floating Step Navigation (Left) & Audio Controls (Right) -->
  <nav id="chapter-stepper" class="chapter-stepper" aria-label="Chapter navigation" hidden>
    <button id="chapter-back-btn" class="stepper-back-btn" type="button" aria-label="Previous step" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span id="chapter-step-label" class="stepper-label">1 / 8</span>
  </nav>

  <div class="floating-audio-pills">
    <button id="sfx-pill" class="music-pill sfx-pill" type="button" aria-label="Toggle romantic sound effects" aria-pressed="true">
      <svg class="icon-music" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5L6 9H2v6h4l5 4V5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="sfx-pill-text">SFX On</span>
    </button>
    <button id="music-pill" class="music-pill" type="button" aria-label="Toggle background music" aria-pressed="false" hidden>
      <svg class="icon-music" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <span class="music-pill-text">Music</span>
    </button>
  </div>

  <!-- Full-Screen Romantic Quote Flash Interlude (between steps) -->
  <div id="quote-interlude" class="overlay-screen quote-interlude" role="status" aria-live="polite" hidden>
    <div class="interlude-inner">
      <svg class="interlude-sketch" viewBox="0 0 260 150" aria-hidden="true">
        <path class="sketch-path" d="M18 102 C56 104, 86 78, 102 52 C112 34, 130 22, 142 36 C152 22, 170 30, 168 50 C166 74, 134 98, 130 108 C124 96, 94 74, 96 52 C98 34, 118 28, 130 44 M156 82 C182 96, 214 98, 244 88" fill="none" stroke="url(#sketchGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="sketch-sparkle" d="M214 34 L217 42 L225 45 L217 48 L214 56 L211 48 L203 45 L211 42 Z" fill="#f7cc7a"/>
        <path class="sketch-sparkle s2" d="M52 38 L54 44 L60 46 L54 48 L52 54 L50 48 L44 46 L50 44 Z" fill="#ff709e"/>
        <defs>
          <linearGradient id="sketchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f7cc7a"/>
            <stop offset="50%" stop-color="#ff709e"/>
            <stop offset="100%" stop-color="#f7cc7a"/>
          </linearGradient>
        </defs>
      </svg>
      <p id="interlude-bn" class="interlude-bn" lang="bn"></p>
      <p id="interlude-en" class="interlude-en" lang="en"></p>
    </div>
  </div>

  <!-- Cute Floating Love-Burst Charm Button -->
  <button id="love-tap-fab" class="love-tap-fab" type="button" aria-label="Send a love burst" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 21s-8.5-5.6-8.5-11.5C3.5 6.4 5.9 4 8.8 4c1.7 0 3.2.9 3.2 2.3C12 4.9 13.5 4 15.2 4 18.1 4 20.5 6.4 20.5 9.5 20.5 15.4 12 21 12 21Z"/>
    </svg>
  </button>

  <!-- 00. Royal Romantic Onboarding Curtain -->
  <section id="onboarding-screen" class="overlay-screen onboarding-screen" aria-label="Birthday premiere welcome" hidden>
    <div class="curtain-spotlight" aria-hidden="true"></div>
    <div class="velvet-curtain curtain-left" aria-hidden="true"></div>
    <div class="velvet-curtain curtain-right" aria-hidden="true"></div>
    <div class="curtain-seam-glow" aria-hidden="true"></div>
    <div class="glass-card onboarding-card royal-card premiere-ticket">
      <!-- Ornate Gold Corner Sparkles -->
      <svg class="corner-ornament tl" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 28 V10 Q4 4 10 4 H28" fill="none" stroke="#f7cc7a" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="9" r="2" fill="#ff709e"/></svg>
      <svg class="corner-ornament tr" viewBox="0 0 32 32" aria-hidden="true"><path d="M28 28 V10 Q28 4 22 4 H4" fill="none" stroke="#f7cc7a" stroke-width="1.6" stroke-linecap="round"/><circle cx="23" cy="9" r="2" fill="#ff709e"/></svg>
      <svg class="corner-ornament bl" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 4 V22 Q4 28 10 28 H28" fill="none" stroke="#f7cc7a" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="23" r="2" fill="#ff709e"/></svg>
      <svg class="corner-ornament br" viewBox="0 0 32 32" aria-hidden="true"><path d="M28 4 V22 Q28 28 22 28 H4" fill="none" stroke="#f7cc7a" stroke-width="1.6" stroke-linecap="round"/><circle cx="23" cy="23" r="2" fill="#ff709e"/></svg>

      <div class="premiere-date-pill">
        <span class="premiere-date-bn" id="premiere-date-bn" lang="bn">২৮ নভেম্বর</span>
        <span class="premiere-date-sep" aria-hidden="true">•</span>
        <span class="premiere-date-en" id="premiere-date-en" lang="en">28 NOVEMBER</span>
      </div>

      <div class="premiere-portrait-wrap">
        <div class="royal-crest premiere-crown" aria-hidden="true">
          <svg class="crown-svg" viewBox="0 0 64 42">
            <path d="M6 34 L10 12 L23 23 L32 6 L41 23 L54 12 L58 34 Z" fill="none" stroke="#f7cc7a" stroke-width="2.2" stroke-linejoin="round"/>
            <circle cx="10" cy="10" r="2.6" fill="#ffd9e6"/>
            <circle cx="32" cy="4.5" r="3.4" fill="#ff709e"/>
            <circle cx="54" cy="10" r="2.6" fill="#ffd9e6"/>
            <line x1="8" y1="38" x2="56" y2="38" stroke="#f7cc7a" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="premiere-heart-portrait">
          <svg viewBox="0 0 120 110" aria-label="Maharani Tonni">
            <defs>
              <clipPath id="premiereHeartClip">
                <path d="M60 100C60 100 10 68 10 34C10 17 23 6 38 6C48 6 56 11.5 60 19.5C64 11.5 72 6 82 6C97 6 110 17 110 34C110 68 60 100 60 100Z"/>
              </clipPath>
            </defs>
            <image id="premiere-portrait-img" href="assets/media/tonni.jpg" width="120" height="110" preserveAspectRatio="xMidYMid slice" clip-path="url(#premiereHeartClip)"/>
            <path d="M60 100C60 100 10 68 10 34C10 17 23 6 38 6C48 6 56 11.5 60 19.5C64 11.5 72 6 82 6C97 6 110 17 110 34C110 68 60 100 60 100Z" fill="none" stroke="#f7cc7a" stroke-width="3"/>
          </svg>
        </div>
      </div>

      <p class="eyebrow" id="onboarding-eyebrow" lang="en"></p>
      <h1 class="onboarding-title-bn" id="onboarding-title-bn" lang="bn"></h1>
      <p class="onboarding-title-en" id="onboarding-title-en" lang="en"></p>

      <div id="premiere-countdown" class="premiere-countdown" aria-live="polite"></div>

      <p class="onboarding-sub-bn" id="onboarding-sub-bn" lang="bn"></p>
      <p class="onboarding-sub-en" id="onboarding-sub-en" lang="en"></p>
      <button id="onboarding-enter-btn" class="btn btn-gold btn-royal-enter" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21s-8.5-5.6-8.5-11.5C3.5 6.4 5.9 4 8.8 4c1.7 0 3.2.9 3.2 2.3C12 4.9 13.5 4 15.2 4 18.1 4 20.5 6.4 20.5 9.5 20.5 15.4 12 21 12 21Z" fill="currentColor"/>
        </svg>
        <span class="btn-bilingual">
          <span id="onboarding-btn-bn" lang="bn"></span>
          <span id="onboarding-btn-en" lang="en"></span>
        </span>
      </button>
    </div>
  </section>

  <!-- 0. Optional Gate Screen -->
  <section id="gate-screen" class="overlay-screen gate-screen" aria-label="Private entry question" hidden>
    <div class="glass-card gate-card">
      <div class="gate-heart-wrap" aria-hidden="true">
        <svg class="gate-heart-svg" viewBox="0 0 100 92">
          <path d="M50 86C50 86 8 58 8 28C8 14 19 4 32 4C40.5 4 47.5 8.8 50 15.5C52.5 8.8 59.5 4 68 4C81 4 92 14 92 28C92 58 50 86 50 86Z" />
        </svg>
      </div>
      <p class="gate-question-bn" id="gate-question-bn" lang="bn"></p>
      <p class="gate-question-en" id="gate-question-en" lang="en"></p>
      <form id="gate-form" class="gate-form" novalidate>
        <label for="gate-input" class="sr-only">Your answer</label>
        <input id="gate-input" class="gate-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button id="gate-submit" class="btn btn-gold" type="submit"></button>
      </form>
      <p id="gate-feedback" class="gate-feedback" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- 1. Heart Loader -->
  <div id="loader-screen" class="overlay-screen loader-screen" role="status" aria-live="polite" hidden>
    <div class="loader-inner">
      <svg id="loader-heart-svg" class="loader-heart-svg" viewBox="0 0 120 110" aria-hidden="true">
        <defs>
          <linearGradient id="roseFillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff7a9c"/>
            <stop offset="100%" stop-color="#c93863"/>
          </linearGradient>
        </defs>
        <path id="loader-heart-fill" class="loader-heart-fill" fill="url(#roseFillGrad)" d="M60 100C60 100 10 68 10 33C10 16 23 5 38 5C48 5 56 10.5 60 18.5C64 10.5 72 5 82 5C97 5 110 16 110 33C110 68 60 100 60 100Z"/>
        <path id="loader-heart-stroke" class="loader-heart-stroke" fill="none" stroke="#f2c36b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M60 100C60 100 10 68 10 33C10 16 23 5 38 5C48 5 56 10.5 60 18.5C64 10.5 72 5 82 5C97 5 110 16 110 33C110 68 60 100 60 100Z"/>
      </svg>
      <div id="loader-petals" class="loader-petals" aria-hidden="true"></div>
      <p class="loader-text-bn" id="loader-text-bn" lang="bn"></p>
      <p class="loader-text-en" id="loader-text-en" lang="en"></p>
    </div>
  </div>

  <!-- Main Content -->
  <main id="main-content">

    <!-- 2. Hero -->
    <section id="hero" class="section hero-section">
      <div class="hero-crown-badge" aria-hidden="true">
        <svg class="crown-svg-sm" viewBox="0 0 64 42">
          <path d="M6 34 L10 12 L23 23 L32 6 L41 23 L54 12 L58 34 Z" fill="none" stroke="#f2c36b" stroke-width="2.2" stroke-linejoin="round"/>
          <circle cx="32" cy="4.5" r="3" fill="#ff7a9c"/>
          <line x1="9" y1="38" x2="55" y2="38" stroke="#f2c36b" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="eyebrow" id="hero-eyebrow" lang="en"></p>

      <div class="hero-arch-stage">
        <div class="hero-aurora" aria-hidden="true"></div>
        <div class="hero-orbit" aria-hidden="true">
          <svg class="orbit-sparkle s1" viewBox="0 0 24 24"><path d="M12 1L14.6 9.4L23 12L14.6 14.6L12 23L9.4 14.6L1 12L9.4 9.4Z"/></svg>
          <svg class="orbit-heart h1" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.6-8.5-11.5C3.5 6.4 5.9 4 8.8 4c1.7 0 3.2.9 3.2 2.3C12 4.9 13.5 4 15.2 4 18.1 4 20.5 6.4 20.5 9.5 20.5 15.4 12 21 12 21Z"/></svg>
          <svg class="orbit-sparkle s2" viewBox="0 0 24 24"><path d="M12 1L14.6 9.4L23 12L14.6 14.6L12 23L9.4 14.6L1 12L9.4 9.4Z"/></svg>
          <svg class="orbit-heart h2" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.6-8.5-11.5C3.5 6.4 5.9 4 8.8 4c1.7 0 3.2.9 3.2 2.3C12 4.9 13.5 4 15.2 4 18.1 4 20.5 6.4 20.5 9.5 20.5 15.4 12 21 12 21Z"/></svg>
          <svg class="orbit-sparkle s3" viewBox="0 0 24 24"><path d="M12 1L14.6 9.4L23 12L14.6 14.6L12 23L9.4 14.6L1 12L9.4 9.4Z"/></svg>
        </div>
        <div class="arch-frame">
          <img id="hero-photo" src="assets/media/tonni.jpg" alt="Tonni Sarker smiling" loading="eager" decoding="async">
        </div>
        <span class="arch-love-ribbon" lang="bn" aria-hidden="true">মহারানী</span>
      </div>

      <h1 class="hero-title-bn" id="hero-headline-bn" lang="bn"></h1>
      <p class="hero-title-en" id="hero-headline-en" lang="en"></p>
      <p class="hero-name" id="hero-name" lang="en"></p>

      <div class="days-counter glass-card" aria-live="polite">
        <div class="counter-line-bn" lang="bn">
          <span id="counter-bn-prefix"></span>
          <strong class="counter-num" id="days-count-bn">0</strong>
          <span id="counter-bn-suffix"></span>
        </div>
        <div class="counter-line-en" lang="en">
          <span id="counter-en-prefix"></span>
          <strong class="counter-num" id="days-count-en">0</strong>
          <span id="counter-en-suffix"></span>
        </div>
      </div>

      <div class="hero-actions">
        <button id="hero-music-btn" class="btn btn-glass" type="button" aria-pressed="false">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span id="hero-music-label">Tap to play music</span>
        </button>
      </div>

      <div class="chapter-next-wrap">
        <button id="reveal-film-btn" class="btn btn-gold btn-chapter-next" type="button" data-reveal-target="film">
          <span class="btn-bilingual">
            <span id="reveal-film-bn" lang="bn"></span>
            <span id="reveal-film-en" lang="en"></span>
          </span>
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <div class="section-divider chapter-divider" data-divider-for="film" aria-hidden="true" hidden><span class="divider-line"></span><svg class="divider-heart" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.6-8.5-11.5C3.5 6.4 5.9 4 8.8 4c1.7 0 3.2.9 3.2 2.3C12 4.9 13.5 4 15.2 4 18.1 4 20.5 6.4 20.5 9.5 20.5 15.4 12 21 12 21Z"/></svg><span class="divider-line"></span></div>

    <!-- 3. Film -->
    <section id="film" class="section film-section chapter-reveal" hidden>
      <header class="section-header">
        <h2 class="section-title-bn" id="film-title-bn" lang="bn"></h2>
        <p class="section-title-en" id="film-title-en" lang="en"></p>
        <p class="section-sub" id="film-subtitle" lang="en"></p>
      </header>

      <div class="phone-frame">
        <div class="phone-notch" aria-hidden="true"></div>
        <div class="phone-screen">
          <video id="story-video" src="assets/media/our-story.mp4" poster="assets/media/poster.jpg" playsinline controls preload="metadata"></video>
          <button id="film-play-overlay" class="film-play-overlay" type="button" aria-label="Play our story film">
            <span class="glowing-heart-btn">
              <svg class="heart-bg" viewBox="0 0 100 92" aria-hidden="true">
                <path d="M50 86C50 86 8 58 8 28C8 14 19 4 32 4C40.5 4 47.5 8.8 50 15.5C52.5 8.8 59.5 4 68 4C81 4 92 14 92 28C92 58 50 86 50 86Z"/>
              </svg>
              <svg class="play-tri" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 5.5v13l11-6.5z"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
      <div class="chapter-next-wrap">
        <button id="reveal-gallery-btn" class="btn btn-gold btn-chapter-next" type="button" data-reveal-target="gallery">
          <span class="btn-bilingual">
            <span id="reveal-gallery-bn" lang="bn"></span>
            <span id="reveal-gallery-en" lang="en"></span>
          </span>
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <div class="section-divider chapter-divider" data-divider-for="gallery" aria-hidden="true" hidden><span class="divider-line"></span><svg class="divider-heart" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.6-8.5-11.5C3.5 6.4 5.9 4 8.8 4c1.7 0 3.2.9 3.2 2.3C12 4.9 13.5 4 15.2 4 18.1 4 20.5 6.4 20.5 9.5 20.5 15.4 12 21 12 21Z"/></svg><span class="divider-line"></span></div>

    <!-- 4. Gallery -->
    <section id="gallery" class="section gallery-section chapter-reveal" hidden>
      <header class="section-header">
        <h2 class="section-title-bn" id="gallery-title-bn" lang="bn"></h2>
        <p class="section-title-en" id="gallery-title-en" lang="en"></p>
        <p class="section-sub" id="gallery-subtitle" lang="en"></p>
      </header>

      <!-- 3D Curved Featured Carousel -->
      <div id="featured-carousel-wrap" class="featured-carousel-wrap" hidden>
        <div class="carousel-stage" id="carousel-stage" role="region" aria-label="Featured memories carousel" tabindex="0">
          <div class="carousel-track" id="carousel-track"></div>
        </div>
        <div class="carousel-controls">
          <button id="carousel-prev" class="icon-btn" type="button" aria-label="Previous featured memory">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="carousel-dots" class="carousel-dots" role="tablist" aria-label="Featured slides"></div>
          <button id="carousel-next" class="icon-btn" type="button" aria-label="Next featured memory">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <!-- Memory of the Day + Quick Actions -->
      <div class="gallery-highlights">
        <article id="memory-of-day" class="glass-card motd-card" hidden>
          <div class="motd-thumb-wrap">
            <img id="motd-img" src="" alt="Memory of the day" loading="lazy">
          </div>
          <div class="motd-body">
            <span class="motd-badge-bn" id="motd-label-bn" lang="bn"></span>
            <span class="motd-badge-en" id="motd-label-en" lang="en"></span>
            <p class="motd-date" id="motd-date"></p>
            <button id="motd-open" class="btn btn-small btn-glass" type="button">Open</button>
          </div>
        </article>

        <div class="gallery-cta-stack">
          <button id="surprise-memory-btn" class="btn btn-gold" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8Z" fill="currentColor"/></svg>
            <span class="btn-bilingual">
              <span id="surprise-btn-bn" lang="bn"></span>
              <span id="surprise-btn-en" lang="en"></span>
            </span>
          </button>
          <button id="slideshow-btn" class="btn btn-glass" type="button">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm5 4.5v7l6-3.5-6-3.5z" fill="currentColor"/></svg>
            <span class="btn-bilingual">
              <span id="slideshow-btn-bn" lang="bn"></span>
              <span id="slideshow-btn-en" lang="en"></span>
            </span>
          </button>
